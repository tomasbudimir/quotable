<app-header></app-header>

<ion-content class="ion-padding">
  <div>
    <ion-searchbar placeholder="Search quotes" (ionInput)="filterItems($event)"></ion-searchbar>
    <div class="count-label">
      {{ filteredQuotesCount }} quotes
    </div>
    <div class="quote-container">
      <div class="box" *ngFor="let quote of filteredQuotes">
        <div class="quote link" (click)="navigateToOneQuote(quote.id)">{{ quote.quoteText }}</div>
        <div class="author link" (click)="navigateByQuotedBy(quote.quotedBy)"> {{ quote.quotedBy }}</div>
      </div>
    </div>
  </div>
</ion-content>
